name: fetch-live-sites
on:
  push:
    branches: [fetch-live-sites]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf live && mkdir -p mirror && cd mirror
          wget -q -e robots=off -m -p -E -k -nH --no-parent -U "Mozilla/5.0" https://thevendorspace.netlify.app/ || true
          wget -q -e robots=off -nH -x -U "Mozilla/5.0" https://thevendorspace.netlify.app/_redirects https://thevendorspace.netlify.app/robots.txt https://thevendorspace.netlify.app/sitemap.xml https://thevendorspace.netlify.app/favicon.ico || true
          cd .. && find mirror -type f | head -100 && du -sh mirror
          git config user.name CyberAdSpace; git config user.email Contact@CyberAdSpace.com
          git add -A mirror live .github && git commit -m "Snapshot of TheVendorSpace" && git push
